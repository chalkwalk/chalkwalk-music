name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Both standards, because this library declares a C++17 FLOOR and is
        # meant to be usable from a C++17 project as well as a C++20 one.
        # `target_compile_features(... cxx_std_17)` is a minimum, not a pin --
        # a C++20 parent compiles this at C++20 automatically -- so "supports
        # both" is a claim that costs nothing to make and is worth nothing
        # unless something checks it. This is what checks it.
        std: [17, 20]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} C++${{ matrix.std }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_CXX_STANDARD_REQUIRED=ON
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
